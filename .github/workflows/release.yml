name: Publish to PyPI

# Publishes with PyPI trusted publishing when the version in secapi/_version.py
# is not already on PyPI. A push that does not change the version leaves PyPI
# unchanged.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project name: secapi-py
#   Owner:  secapi-dev
#   Repo:   secapi-python
#   Workflow filename: release.yml
#   Environment: pypi

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/secapi-py
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Check whether this version is on PyPI
        id: pypi
        run: |
          version="$(python -c 'import re, pathlib; text = pathlib.Path("secapi/_version.py").read_text(); print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", text).group(1))')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/secapi-py/${version}/json"; then
            echo "secapi-py ${version} is already on PyPI"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.pypi.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.pypi.outputs.version }}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "GitHub release v${version} already exists"
            exit 0
          fi
          curl -fsS -o /dev/null "https://pypi.org/pypi/secapi-py/${version}/json"
          gh release create "v${version}" --title "v${version}" --generate-notes
